<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Roller IP{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Calm midnight palette: indigo for actions, cyan for secondary emphasis,
     neutral slate surfaces and semantic status colors. */
  :root {
    --bg: #0a1020;
    --bg-soft: #0e1729;
    --panel: #111c31;
    --panel-2: #17243a;
    --panel-border: #2b3b59;
    --panel-border-soft: #202f48;
    --text: #edf2ff;
    --text-dim: #a8b5d0;
    --text-faint: #7888a8;

    --accent: #7789ff;
    --accent-rgb: 119,137,255;
    --accent-2: #52c7e5;
    --accent-2-rgb: 82,199,229;
    --accent-mid: #aeb8ff;
    --accent-strong: #5266dc;

    --ok: #62d6ad;
    --ok-rgb: 98,214,173;
    --ok-bg: rgba(98,214,173,.12);
    --warn: #f2bd72;
    --warn-rgb: 242,189,114;
    --warn-bg: rgba(242,189,114,.12);
    --err: #ff8999;
    --err-rgb: 255,137,153;
    --err-bg: rgba(255,137,153,.12);
    --info: #6bc9e8;
    --info-bg: rgba(107,201,232,.12);

    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.55);
    --font-ui: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1100px 520px at 50% -12%, rgba(var(--accent-rgb),.11), transparent 60%),
      radial-gradient(900px 460px at 95% 4%, rgba(var(--accent-2-rgb),.13), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------------------------------------------------------------- header */
  header {
    display: flex; align-items: center; gap: 28px;
    padding: 16px 28px;
    background: rgba(10,16,32,.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--panel-border-soft);
    position: sticky; top: 0; z-index: 20;
  }
  header .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16.5px; letter-spacing: -.01em; }
  header .brand .mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff; font-weight: 800;
    box-shadow: 0 4px 14px -4px rgba(var(--accent-rgb),.6);
    flex-shrink: 0;
  }
  header .brand .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  header .brand .brand-text .brand-name { color: #fff; }
  header .brand .brand-text .brand-name .accent-word { color: var(--accent-mid); }
  header .brand .brand-text .brand-sub { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-faint); }
  header nav { display: flex; gap: 4px; }
  header nav a {
    color: var(--text-dim); font-weight: 600; font-size: 13.5px;
    padding: 8px 14px; border-radius: 999px; transition: all .15s ease;
  }
  header nav a:hover { color: var(--text); text-decoration: none; background: rgba(255,255,255,.04); }
  header nav a.active { color: #fff; background: rgba(var(--accent-rgb),.16); box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb),.35); }
  header .spacer { flex: 1; }

  main { padding: 40px 24px 64px; max-width: 1240px; margin: 0 auto; }

  /* ----------------------------------------------------------------- page */
  .page-head { text-align: center; margin-bottom: 32px; }
  .page-head h1 { margin: 0 0 8px; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .page-head p { margin: 0; color: var(--text-dim); font-size: 14.5px; max-width: 560px; margin-inline: auto; }
  .page-head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
  .page-head-row h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }

  /* ---------------------------------------------------------------- panel */
  .panel {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 26px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .panel.accent::before {
    content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 2px;
  }
  .panel-tight { padding: 0; overflow: hidden; }
  .panel-center { max-width: 480px; margin-inline: auto; text-align: center; }
  .panel h2 { margin: 0 0 4px; font-size: 18px; font-weight: 700; text-align: center; }
  .panel h3 { font-size: 15px; font-weight: 700; margin: 0 0 10px; }

  /* --------------------------------------------------------------- table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: center; padding: 13px 14px; border-bottom: 1px solid var(--panel-border-soft); vertical-align: middle; }
  th.text-left, td.text-left { text-align: left; }
  th.text-right, td.text-right { text-align: right; }
  th { color: var(--text-faint); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; background: rgba(255,255,255,.015); }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover { background: rgba(255,255,255,.02); }
  tr:last-child td { border-bottom: none; }
  .empty-state { padding: 48px 20px; text-align: center; color: var(--text-dim); }
  .empty-state .glyph { font-size: 30px; margin-bottom: 10px; opacity: .5; }

  .mono { font-family: var(--font-mono); }

  /* --------------------------------------------------------------- badge */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
    letter-spacing: .02em; text-transform: uppercase;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .badge-running { background: var(--ok-bg); color: var(--ok); }
  .badge-stopped { background: rgba(157,178,188,.14); color: var(--text-dim); }
  .badge-cooldown { background: var(--warn-bg); color: var(--warn); }
  .badge-error { background: var(--err-bg); color: var(--err); }
  .badge-match { background: var(--ok-bg); color: var(--ok); }
  .badge-miss { background: rgba(157,178,188,.14); color: var(--text-dim); }
  .badge-zone { background: var(--info-bg); color: var(--info); font-family: var(--font-mono); }
  .badge-running::before, .badge-cooldown::before { animation: pulse-glow 1.7s ease-in-out infinite; }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0 0 currentColor; }
    50% { box-shadow: 0 0 0 4px transparent; opacity: .5; }
  }

  /* -------------------------------------------------------------- buttons */
  button, .btn {
    background: linear-gradient(180deg, var(--accent-mid), var(--accent-strong));
    color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 10px 18px; font-size: 13.5px; cursor: pointer; font-weight: 600;
    font-family: var(--font-ui);
    box-shadow: 0 6px 16px -6px rgba(var(--accent-rgb),.5);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:hover, .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -8px rgba(var(--accent-rgb),.65); text-decoration: none; opacity: 1; }
  button:active, .btn:active { transform: translateY(0); }
  .btn-secondary { background: var(--panel-2); border: 1px solid var(--panel-border); box-shadow: none; color: var(--text); }
  .btn-secondary:hover { background: #16465a; box-shadow: none; }
  .btn-danger { background: linear-gradient(180deg, #f38e91, #91363f); box-shadow: 0 6px 16px -6px rgba(145,54,63,.55); }
  .btn-sm { padding: 7px 13px; font-size: 12.5px; }
  .btn-block { width: 100%; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
  .btn-row.left { justify-content: flex-start; }
  .actions form { display: inline-flex; }

  /* ----------------------------------------------------------- icon button */
  .icon-btn {
    background: var(--panel-2); border: 1px solid var(--panel-border); box-shadow: none;
    color: var(--text-dim); padding: 7px; width: 32px; height: 32px; border-radius: var(--radius-sm);
  }
  .icon-btn:hover { color: #fff; border-color: var(--accent-2); background: #16465a; box-shadow: none; transform: none; }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn.is-copied { color: var(--ok); border-color: rgba(var(--ok-rgb),.4); }

  /* -------------------------------------------------------------- inputs */
  input[type=text], input[type=password], input[type=search], select {
    background: var(--bg-soft); border: 1px solid var(--panel-border); color: var(--text);
    padding: 11px 13px; border-radius: var(--radius-sm); width: 100%; font-size: 14px;
    font-family: var(--font-ui); transition: border-color .12s ease, box-shadow .12s ease;
  }
  input:focus, select:focus {
    outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(var(--accent-2-rgb),.2);
  }
  label { display: block; margin-bottom: 7px; color: var(--text-dim); font-size: 13px; font-weight: 600; text-align: center; }
  .field { margin-bottom: 18px; text-align: center; }
  .field .hint { color: var(--text-faint); font-size: 12px; margin-top: 6px; line-height: 1.5; }
  form { text-align: center; }

  /* --------------------------------------------------------------- flash */
  .flash {
    padding: 13px 16px; border-radius: var(--radius-sm); margin-bottom: 20px;
    font-size: 13.5px; font-weight: 600; text-align: center;
    border: 1px solid transparent;
  }
  .flash-error { background: var(--err-bg); color: #ffcdd0; border-color: rgba(var(--err-rgb),.35); }
  .flash-ok { background: var(--ok-bg); color: #7ff0bf; border-color: rgba(var(--ok-rgb),.3); }

  /* --------------------------------------------------------------- misc */
  .muted { color: var(--text-dim); }
  .faint { color: var(--text-faint); }
  .row { display: flex; gap: 10px; align-items: center; justify-content: center; }
  .center { text-align: center; }
  .divider { height: 1px; background: var(--panel-border-soft); margin: 22px 0; border: none; }

  /* ----------------------------------------------------------- callouts */
  .callout {
    display: flex; gap: 12px; text-align: left; padding: 14px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--panel-border); background: rgba(255,255,255,.02); margin-bottom: 16px;
    font-size: 13.5px; line-height: 1.6;
  }
  .callout .icon { font-size: 16px; line-height: 1.3; flex-shrink: 0; }
  .callout-info { border-color: rgba(53,153,206,.32); background: var(--info-bg); color: #cdeafb; }
  .callout-warn { border-color: rgba(251,191,36,.28); background: var(--warn-bg); color: #ffdca0; }
  .callout-tip { border-color: rgba(52,211,153,.25); background: var(--ok-bg); color: #b6f2d4; }
  .callout-danger { border-color: rgba(243,142,145,.32); background: var(--err-bg); color: #ffd3d5; }
  .callout b, .callout strong { color: #fff; }
  .callout code, .callout .mono { color: inherit; }

  /* Polish and motion are deliberately restrained for a monitoring UI. */
  button, .btn, .btn-secondary, .btn-danger, .panel, .stat-card, .toc-btn {
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background-color .18s ease;
  }
  button:hover:not(:disabled), .btn:hover, .btn-secondary:hover, .btn-danger:hover { transform: translateY(-1px); }
  .panel { animation: panel-enter .36s cubic-bezier(.2,.75,.25,1) both; }
  .stat-card:hover { transform: translateY(-2px); border-color: rgba(var(--accent-rgb),.46); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid rgba(var(--accent-2-rgb),.55); outline-offset: 2px;
  }
  @keyframes panel-enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
  }

  /* Product UI refresh: clear hierarchy, left-aligned data, compact app nav,
     responsive tables and optional light palette. */
  body { background: radial-gradient(900px 360px at 10% -8%, rgba(var(--accent-rgb),.12), transparent 65%), var(--bg); }
  header { gap: 18px; padding: 12px clamp(14px,3vw,36px); }
  header nav { flex-wrap: wrap; }
  header nav a { border-radius: 10px; }
  main { max-width: 1440px; padding: clamp(22px,4vw,44px) clamp(14px,3vw,34px) 64px; }
  .page-head { text-align: left; margin-bottom: 24px; }
  .page-head p { margin-inline: 0; }
  .page-head-row { margin-bottom: 20px; }
  .panel { padding: 22px; border-radius: 14px; }
  .panel-tight { padding: 0; }
  .panel h2, .panel h3 { text-align: left; }
  label, .field, form { text-align: left; }
  .btn-row { justify-content: flex-start; }
  th, td { text-align: left; }
  th:not(.text-left):not(.text-right), td:not(.text-left):not(.text-right) { text-align: left; }
  th { position: sticky; top: 0; z-index: 1; }
  .stat-grid { grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); }
  .stat-card { text-align: left; padding: 18px; }
  .stat-card .label { letter-spacing: .035em; }
  .console { background: #0b1321; }
  .app-toolbar { display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-left:auto; }
  .theme-toggle { white-space:nowrap; }
  .section-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 14px; }
  .section-title h2 { margin:0; font-size:16px; }
  .metric-note { color:var(--text-faint); font-size:12px; }
  .table-wrap table { min-width: 720px; }
  .filter-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .filter-row form { display:flex; gap:8px; align-items:center; flex:1; }
  .filter-row input,.filter-row select { max-width:280px; }
  .chart-bars { display:grid; gap:9px; }
  .chart-row { display:grid; grid-template-columns:minmax(80px,130px) 1fr 52px; gap:12px; align-items:center; font-size:12px; }
  .chart-track { height:10px; background:var(--panel-border-soft); border-radius:99px; overflow:hidden; }
  .chart-fill { height:100%; min-width:2px; border-radius:inherit; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
  .data-chip { display:inline-flex; border:1px solid var(--panel-border); background:var(--bg-soft); padding:4px 9px; border-radius:999px; font-size:11px; color:var(--text-dim); }
  .theme-light {
    --bg:#f3f6fb; --bg-soft:#ffffff; --panel:#ffffff; --panel-2:#ffffff;
    --panel-border:#dbe3ef; --panel-border-soft:#e8edf5;
    --text:#17243a; --text-dim:#56657c; --text-faint:#7b8aa2;
    --accent:#4e63da; --accent-rgb:78,99,218; --accent-2:#168bb5; --accent-2-rgb:22,139,181;
    --accent-mid:#7182e8; --accent-strong:#4d60ca;
    --ok:#188767; --ok-rgb:24,135,103; --ok-bg:rgba(24,135,103,.10);
    --warn:#a9660b; --warn-rgb:169,102,11; --warn-bg:rgba(169,102,11,.10);
    --err:#bd4355; --err-rgb:189,67,85; --err-bg:rgba(189,67,85,.09);
    --info:#227eaa; --info-bg:rgba(34,126,170,.09); --shadow:0 8px 24px -16px rgba(31,48,78,.35);
  }
  .theme-light body { background:radial-gradient(900px 360px at 10% -8%,rgba(var(--accent-rgb),.08),transparent 65%),var(--bg); }
  .theme-light header { background:rgba(255,255,255,.92); }
  .theme-light header .brand .brand-name,.theme-light .stat-card .num,.theme-light .callout b,.theme-light .callout strong,
  .theme-light .console-ip { color:var(--text); }
  .theme-light .console { background:#f8faff; }
  .theme-light .btn-secondary:hover,.theme-light .icon-btn:hover,.theme-light .zone-row:hover { background:#e8effb; color:var(--text); }
  .theme-light .flash-error { color:#8f2637; }
  .theme-light .flash-ok { color:#12684f; }
  @media(max-width:900px) {
    header { flex-wrap:wrap; }
    header nav { order:3; width:100%; overflow-x:auto; flex-wrap:nowrap; }
    header nav a { white-space:nowrap; }
    .app-toolbar { margin-left:auto; }
    main { padding-top:24px; }
  }
  @media(max-width:560px) {
    .brand-sub { display:none; }
    .page-head-row { align-items:flex-start; }
    .page-head-row h1 { font-size:21px; }
    .stat-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .stat-card { padding:13px; }
    .stat-card .num { font-size:19px; }
    .panel { padding:16px; }
    .panel-tight { padding:0; }
    .chart-row { grid-template-columns:72px 1fr 42px; gap:8px; }
    .filter-row form { flex-direction:column; align-items:stretch; }
    .filter-row input,.filter-row select { max-width:none; }
  }

  /* -------------------------------------------------------------- steps */
  .steps { counter-reset: step; list-style: none; margin: 0; padding: 0; text-align: left; }
  .steps li {
    counter-increment: step; position: relative; padding: 0 0 22px 42px; margin-bottom: 4px;
  }
  .steps li::before {
    content: counter(step); position: absolute; left: 0; top: 0;
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 800; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .steps li::after {
    content: ""; position: absolute; left: 13px; top: 30px; bottom: 0; width: 1px;
    background: var(--panel-border);
  }
  .steps li:last-child::after { display: none; }
  .steps li h4 { margin: 3px 0 6px; font-size: 14.5px; font-weight: 700; }
  .steps li p { margin: 0 0 8px; color: var(--text-dim); font-size: 13.5px; }
  .steps li .mono-box { margin-top: 6px; }

  .mono-box {
    background: var(--bg-soft); border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 9px 12px; font-family: var(--font-mono); font-size: 13px; color: var(--accent-2);
    display: inline-block;
  }

  /* -------------------------------------------------------------- chips */
  .chip-grid { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .chip {
    display: flex; align-items: center; justify-content: center; gap: 9px; padding: 10px 14px;
    border: 1px solid var(--panel-border); border-radius: 999px; background: var(--bg-soft);
    cursor: pointer; transition: all .12s ease; font-size: 13px;
  }
  .chip:hover { border-color: var(--accent-2); }
  .chip input { width: auto; margin: 0; accent-color: var(--accent); }
  .chip input:checked ~ span { color: #fff; }
  .chip:has(input:checked) { border-color: var(--accent); background: rgba(var(--accent-rgb),.14); box-shadow: 0 0 0 1px rgba(var(--accent-rgb),.3); }
  .chip.disabled, .chip:has(input:disabled) { opacity: .4; cursor: not-allowed; }
  .zone-group { margin-bottom: 22px; }
  .zone-group h4 { margin: 0 0 12px; color: var(--text-dim); font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; text-align: center; }

  /* ---------------------------------------------------------- zone list */
  .zone-list {
    display: flex; flex-direction: column;
    width: fit-content; min-width: 150px; margin-inline: auto;
    border: 1px solid var(--panel-border); border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .zone-row {
    display: flex; align-items: center; justify-content: space-between; gap: 26px;
    padding: 8px 13px; background: var(--bg-soft); border-bottom: 1px solid var(--panel-border-soft);
    cursor: pointer; transition: background .12s ease;
  }
  .zone-row:last-child { border-bottom: none; }
  .zone-row:hover { background: #16465a; }
  .zone-row:has(input:checked) { background: rgba(var(--accent-rgb),.13); }
  .zone-row .mono { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .zone-row input[type=checkbox] {
    width: 15px; height: 15px; margin: 0; accent-color: var(--accent); cursor: pointer; flex-shrink: 0;
  }

  /* ------------------------------------------------------------- stats */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .stat-card {
    background: var(--bg-soft); border: 1px solid var(--panel-border); border-radius: var(--radius-sm);
    padding: 16px; text-align: center;
  }
  .stat-card .num { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: #fff; }
  .stat-card .num.ok { color: var(--ok); }
  .stat-card .num.warn { color: var(--warn); }
  .stat-card .num.err { color: var(--err); }
  .stat-card .label { color: var(--text-faint); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; font-weight: 700; }

  /* -------------------------------------------------------------- console */
  .console {
    background: #051119; border: 1px solid var(--panel-border); border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-size: 12.5px; line-height: 1.8;
    padding: 16px 18px; max-height: 520px; overflow-y: auto; text-align: left;
  }
  .console::-webkit-scrollbar { width: 8px; }
  .console::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 8px; }
  .console-line { white-space: pre-wrap; word-break: break-word; padding: 3px 6px; border-radius: 4px; }
  .lvl { font-weight: 700; margin-right: 8px; }
  .lvl-MATCH { color: var(--ok); }
  .lvl-MISS { color: var(--text-faint); }
  .lvl-ERROR { color: var(--err); }
  .console-line.is-match { background: rgba(var(--ok-rgb),.07); }
  .console-line.is-error { background: rgba(var(--err-rgb),.07); }
  .console-ts { color: var(--text-faint); }
  .console-zone { color: var(--accent-2); font-weight: 600; }
  .console-ip { color: #fff; }

  /* -------------------------------------------------------------- misc2 */
  .kicker { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 800; color: var(--accent-2); margin-bottom: 8px; }
  .copy-hint { font-size: 11px; color: var(--text-faint); }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 28px; }
  .toc a {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--panel-border);
    background: var(--panel-2); color: var(--text-dim); font-size: 12.5px; font-weight: 600;
  }
  .toc a:hover { text-decoration: none; color: #fff; border-color: var(--accent-2); }
  .toc button.toc-btn {
    background: var(--panel-2); border: 1px solid var(--panel-border); border-radius: 999px;
    color: var(--text-dim); font-size: 12.5px; font-weight: 600; padding: 7px 14px;
    cursor: pointer; box-shadow: none; font-family: var(--font-ui); transition: all .12s ease;
  }
  .toc button.toc-btn:hover { color: #fff; border-color: var(--accent-2); box-shadow: none; transform: none; }
  .toc button.toc-btn.active {
    color: #fff; background: rgba(var(--accent-rgb),.16); border-color: transparent;
    box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb),.35);
  }

  /* -------------------------------------------------------------- found-ips toolbar */
  .found-toolbar {
    display: flex; align-items: center; gap: 14px; justify-content: space-between;
    padding: 18px 22px; border-bottom: 1px solid var(--panel-border-soft); flex-wrap: wrap;
  }
  .found-toolbar form { flex: 1; min-width: 220px; max-width: 420px; text-align: left; }
  .found-toolbar input[type=text] { margin: 0; }
  .found-count {
    display: flex; align-items: baseline; gap: 7px; white-space: nowrap;
    color: var(--text-dim); font-size: 13px; font-weight: 600;
  }
  .found-count .num { font-family: var(--font-mono); font-size: 19px; font-weight: 700; color: var(--ok); }

  /* -------------------------------------------------------------- drawer */
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(3,10,15,.62); backdrop-filter: blur(3px);
    opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility 0s linear .2s; z-index: 60;
  }
  .drawer-backdrop.open { opacity: 1; visibility: visible; transition: opacity .2s ease; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100dvh; width: min(460px, 100vw);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border-left: 1px solid var(--panel-border);
    box-shadow: -24px 0 60px -20px rgba(0,0,0,.65);
    transform: translateX(100%);
    transition: transform .25s cubic-bezier(.16,1,.3,1);
    z-index: 61; display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 18px 22px; border-bottom: 1px solid var(--panel-border-soft); flex-shrink: 0;
  }
  .drawer-header h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .drawer-live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--ok); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .drawer-live-dot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: pulse-glow 1.7s ease-in-out infinite; }
  .drawer-close {
    background: none; border: none; color: var(--text-dim); font-size: 22px; line-height: 1; cursor: pointer;
    padding: 4px 9px; border-radius: 8px; box-shadow: none;
  }
  .drawer-close:hover { color: #fff; background: rgba(255,255,255,.06); transform: none; box-shadow: none; }
  .drawer-body { padding: 22px; overflow-y: auto; flex: 1; }
  .drawer-body .page-head, .drawer-body .page-head-row { display: none; }
  .drawer-body .panel { background: none; border: none; box-shadow: none; padding: 0; margin-bottom: 18px; }
  .drawer-body .panel.accent::before { display: none; }
  .drawer-body .panel-tight { overflow: visible; }

  @media (max-width: 720px) {
    header { flex-wrap: wrap; padding: 14px 16px; gap: 12px; }
    header nav { order: 3; width: 100%; justify-content: center; }
    main { padding: 28px 14px 48px; }
    .panel { padding: 18px; }
    .page-head-row { justify-content: center; text-align: center; }
    .drawer { width: 100vw; }
    .found-toolbar { justify-content: center; }
    .found-toolbar form { max-width: none; }
  }
</style>
</head>
<body>
{% if authenticated %}
<header>
  <div class="brand">
    <span class="mark">S</span>
    <span class="brand-text">
      <span class="brand-name">Roller <span class="accent-word">IP</span></span>
      <span class="brand-sub">Selectel</span>
    </span>
  </div>
  <nav>
    <a href="/" class="{{ 'active' if active_nav == 'dashboard' else '' }}">Дашборд</a>
    <a href="/analytics" class="{{ 'active' if active_nav == 'analytics' else '' }}">Аналитика</a>
    <a href="/ip-history" class="{{ 'active' if active_nav == 'history' else '' }}">История IP</a>
    <a href="/found-ips" class="{{ 'active' if active_nav == 'found' else '' }}">Найденные IP</a>
    <a href="/managed-resources" class="{{ 'active' if active_nav == 'resources' else '' }}">Ресурсы</a>
    <a href="/logs" class="{{ 'active' if active_nav == 'logs' else '' }}">Общие логи</a>
    <a href="/audit" class="{{ 'active' if active_nav == 'audit' else '' }}">Аудит</a>
    <a href="/help" class="{{ 'active' if active_nav == 'help' else '' }}">Инструкция</a>
  </nav>
  <div class="spacer"></div>
  <div class="app-toolbar">
    <button type="button" class="btn-secondary btn-sm theme-toggle" id="theme-toggle" aria-label="Переключить тему">Светлая тема</button>
    <form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit" class="btn-secondary btn-sm">Выйти</button></form>
  </div>
</header>
{% endif %}
<main>
  {% if flash %}
    <div class="flash flash-{{ flash.kind }}">{{ flash.text }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</main>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true">
  <div class="drawer-header">
    <h3 id="drawer-title">—</h3>
    <div class="row" style="gap:12px;">
      <span class="drawer-live-dot" id="drawer-live-dot" style="display:none;"><span class="dot"></span>live</span>
      <button type="button" class="drawer-close" id="drawer-close" aria-label="Закрыть">×</button>
    </div>
  </div>
  <div class="drawer-body" id="drawer-body">
    <div class="empty-state">Загрузка…</div>
  </div>
</div>

<script>
// Приводит ISO-таймстемпы (data-ts) к читаемому локальному времени пользователя.
function formatTimestamps(root) {
  (root || document).querySelectorAll('[data-ts]').forEach(function (el) {
    var raw = el.getAttribute('data-ts');
    if (!raw) return;
    var d = new Date(raw);
    if (isNaN(d.getTime())) return;
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    var datePart = sameDay ? '' : d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ';
    el.textContent = datePart + time;
    el.title = raw + ' (UTC)';
  });
}

// Живой обратный отсчёт cooldown (data-cooldown-until="<ISO UTC момент окончания>").
// Тикает каждую секунду сам, без ожидания следующего опроса воркера —
// поэтому счётчик не "замирает" на месте между обновлениями с сервера.
function tickCooldowns(root) {
  (root || document).querySelectorAll('[data-cooldown-until]').forEach(function (el) {
    var raw = el.getAttribute('data-cooldown-until');
    if (!raw) return;
    var until = new Date(raw);
    if (isNaN(until.getTime())) return;
    if (el.__cooldownTimer) { clearInterval(el.__cooldownTimer); }

    function render() {
      var diffMs = until.getTime() - Date.now();
      var diffS = Math.round(diffMs / 1000);
      if (diffS > 0) {
        el.textContent = 'cooldown, осталось ~' + diffS + 'с';
      } else {
        el.textContent = 'cooldown, скоро продолжит…';
        clearInterval(el.__cooldownTimer);
        el.__cooldownTimer = null;
      }
    }
    render();
    el.__cooldownTimer = setInterval(render, 1000);
  });
}

document.addEventListener('DOMContentLoaded', function () {
  formatTimestamps(document);
  tickCooldowns(document);
  var themeButton = document.getElementById('theme-toggle');
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('ip-roller-theme'); } catch (_) {}
  if (savedTheme === 'light') document.documentElement.classList.add('theme-light');
  if (themeButton) {
    function updateThemeButton() { themeButton.textContent = document.documentElement.classList.contains('theme-light') ? 'Тёмная тема' : 'Светлая тема'; }
    updateThemeButton();
    themeButton.addEventListener('click', function () {
      var light = document.documentElement.classList.toggle('theme-light');
      try { localStorage.setItem('ip-roller-theme', light ? 'light' : 'dark'); } catch (_) {}
      updateThemeButton();
    });
  }
});

// Общий помощник для живого обновления #live-region (используется и
// верхнеуровневым poll(), и live-режимом drawer). Раньше при обновлении
// сохранялась позиция скролла .console ТОЛЬКО если пользователь был у
// самого низа — а если он прокрутил вверх почитать более старые записи,
// следующее обновление заменяло innerHTML целиком (новый .console-узел
// всегда стартует с scrollTop=0) и молча уносило его обратно наверх.
// Теперь позиция восстанавливается всегда: у низа — остаёмся у низа
// (живое слежение), иначе — возвращаемся ровно туда, где читали. Заодно
// подстраховываем скролл всей страницы на случай, если высота региона
// изменилась и браузер сам сдвинул viewport.
function applyLiveRegionUpdate(regionEl, freshRegionEl) {
  var oldConsole = regionEl.querySelector('.console');
  var consoleScrollTop = oldConsole ? oldConsole.scrollTop : null;
  var consoleAtBottom = oldConsole
    ? (oldConsole.scrollTop + oldConsole.clientHeight >= oldConsole.scrollHeight - 16)
    : false;
  var pageScrollY = window.scrollY;

  regionEl.innerHTML = freshRegionEl.innerHTML;
  formatTimestamps(regionEl);
  tickCooldowns(regionEl);

  var newConsole = regionEl.querySelector('.console');
  if (newConsole) {
    if (consoleAtBottom) {
      newConsole.scrollTop = newConsole.scrollHeight;
    } else if (consoleScrollTop !== null) {
      newConsole.scrollTop = Math.min(consoleScrollTop, newConsole.scrollHeight);
    }
  }
  if (window.scrollY !== pageScrollY) {
    window.scrollTo(0, pageScrollY);
  }
}

// Живое обновление: если на странице есть #live-region, периодически
// подтягиваем ту же страницу и заменяем содержимое региона свежим —
// без полной перезагрузки и без сброса скролла у .console.
(function () {
  var region = document.getElementById('live-region');
  if (!region) return;
  var intervalMs = parseInt(region.getAttribute('data-poll-interval') || '4000', 10);
  var inFlight = false;

  function poll() {
    if (inFlight || document.hidden) return;
    inFlight = true;
    fetch(location.pathname + location.search, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (html) {
        if (!html) return;
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var fresh = doc.getElementById('live-region');
        if (!fresh) return;
        applyLiveRegionUpdate(region, fresh);
      })
      .catch(function () {})
      .finally(function () { inFlight = false; });
  }

  window.__liveRegionPoll = poll;
  setInterval(poll, intervalMs);
})();

// Выезжающая панель (drawer) справа — для «Зоны» и «Логи» на дашборде,
// без перехода на отдельную страницу. Прогрессивное улучшение: если JS
// недоступен, ссылки работают как обычные переходы на полноценные страницы.
(function () {
  var backdrop = document.getElementById('drawer-backdrop');
  var drawer = document.getElementById('drawer');
  var titleEl = document.getElementById('drawer-title');
  var bodyEl = document.getElementById('drawer-body');
  var closeBtn = document.getElementById('drawer-close');
  var liveDot = document.getElementById('drawer-live-dot');
  var liveTimer = null;
  var currentUrl = null;

  function stopDrawerLive() {
    if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
    liveDot.style.display = 'none';
  }

  function closeDrawer() {
    backdrop.classList.remove('open');
    drawer.classList.remove('open');
    stopDrawerLive();
    currentUrl = null;
  }

  function fillFrom(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var main = doc.querySelector('main');
    bodyEl.innerHTML = main ? main.innerHTML : '<div class="empty-state">Не удалось загрузить.</div>';
    formatTimestamps(bodyEl);
    tickCooldowns(bodyEl);
  }

  function openDrawer(url, title, live) {
    currentUrl = url;
    titleEl.textContent = title || '';
    bodyEl.innerHTML = '<div class="empty-state">Загрузка…</div>';
    backdrop.classList.add('open');
    drawer.classList.add('open');
    stopDrawerLive();

    fetch(url, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error('bad status')); })
      .then(fillFrom)
      .catch(function () { bodyEl.innerHTML = '<div class="empty-state">Не удалось загрузить. Попробуй ещё раз.</div>'; });

    if (live) {
      liveDot.style.display = 'inline-flex';
      liveTimer = setInterval(function () {
        if (!drawer.classList.contains('open') || currentUrl !== url) { stopDrawerLive(); return; }
        var region = bodyEl.querySelector('#live-region');
        fetch(url, { credentials: 'same-origin' })
          .then(function (r) { return r.ok ? r.text() : null; })
          .then(function (html) {
            if (!html || !drawer.classList.contains('open')) return;
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var freshRegion = doc.getElementById('live-region');
            if (region && freshRegion) applyLiveRegionUpdate(region, freshRegion);
          })
          .catch(function () {});
      }, 1500);
    }
  }

  document.addEventListener('click', function (e) {
    var trigger = e.target.closest('[data-drawer]');
    if (trigger) {
      e.preventDefault();
      openDrawer(
        trigger.getAttribute('href'),
        trigger.getAttribute('data-drawer-title') || '',
        trigger.getAttribute('data-drawer-live') === 'true'
      );
      return;
    }
    if (e.target === backdrop || e.target === closeBtn || (closeBtn && closeBtn.contains(e.target))) {
      closeDrawer();
      return;
    }
    var backLink = e.target.closest('#drawer-body a[href="/"]');
    if (backLink) { e.preventDefault(); closeDrawer(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

  // AJAX-сабмит форм внутри drawer (например, сохранение зон) — без перехода/перезагрузки.
  bodyEl.addEventListener('submit', function (e) {
    var form = e.target;
    if (!(form instanceof HTMLFormElement)) return;
    e.preventDefault();
    var fd = new FormData(form);
    var action = form.getAttribute('action') || currentUrl;
    fetch(action, { method: (form.getAttribute('method') || 'POST').toUpperCase(), body: fd, credentials: 'same-origin' })
      .then(function () {
        closeDrawer();
        if (typeof window.__liveRegionPoll === 'function') window.__liveRegionPoll();
      })
      .catch(function () { closeDrawer(); });
  });
})();
</script>
</body>
</html>
